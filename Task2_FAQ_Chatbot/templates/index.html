<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha FAQ Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">CODEALPHA • AI INTERNSHIP</p>
        <h1>FAQ Assistant</h1>
        <p class="subtitle">Ask a question about the internship, tasks, certificates, or submission process.</p>
      </div>
      <div class="status"><span></span> NLP engine online</div>
    </section>

    <section class="chat-card">
      <div id="chat-window" class="chat-window">
        <div class="message bot"><div class="avatar">AI</div><div><div class="bubble">Hello! I am the CodeAlpha FAQ assistant. How can I help you?</div><small>TF-IDF + cosine similarity</small></div></div>
      </div>
      <form id="chat-form" class="input-row">
        <input id="question" autocomplete="off" placeholder="Type your question here..." required>
        <button type="submit">Send</button>
      </form>
      <div class="suggestions">
        <button data-question="How many tasks must I complete?">Tasks required</button>
        <button data-question="Where should I upload my source code?">GitHub upload</button>
        <button data-question="Will I receive a certificate?">Certificate</button>
      </div>
    </section>

    <section class="faq-panel">
      <h2>Available FAQ topics</h2>
      <div class="faq-grid">{% for faq in faqs %}<button class="faq-item" data-question="{{ faq.question }}">{{ faq.question }}</button>{% endfor %}</div>
    </section>
  </main>
<script>
const form = document.getElementById('chat-form');
const input = document.getElementById('question');
const windowEl = document.getElementById('chat-window');
function addMessage(text, type, meta='') {
  const row = document.createElement('div'); row.className = `message ${type}`;
  row.innerHTML = `<div class="avatar">${type === 'bot' ? 'AI' : 'YOU'}</div><div><div class="bubble"></div>${meta ? `<small>${meta}</small>` : ''}</div>`;
  row.querySelector('.bubble').textContent = text; windowEl.appendChild(row); windowEl.scrollTop = windowEl.scrollHeight;
}
async function askQuestion(question) {
  if (!question.trim()) return;
  addMessage(question, 'user'); input.value = '';
  const response = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question})});
  const data = await response.json();
  const meta = data.matched_question ? `Matched FAQ: “${data.matched_question}” • similarity: ${data.score}` : `No strong match • similarity: ${data.score}`;
  addMessage(data.answer, 'bot', meta);
}
form.addEventListener('submit', e => {e.preventDefault(); askQuestion(input.value);});
document.querySelectorAll('[data-question]').forEach(btn => btn.addEventListener('click', () => askQuestion(btn.dataset.question)));
</script>
</body>
</html>
