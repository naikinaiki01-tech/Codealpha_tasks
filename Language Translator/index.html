<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
<h1>Language Translation Tool</h1>


    <p>
        Lets Translate your text from one Language to another.
    </p>

    <label>Enter Text:</label>
    <br>
    <textarea id="text" rows="5" cols="70"></textarea>
    <br><br>
    <label>Source Language:</label>
<select id="source">
    <option value="en">English</option>
    <option value="ur">Urdu</option>
    <option value="ar">Arabic</option>
    <option value="fr">French</option>
</select>

<br><br>

<label>Target Language:</label>
<select id="target">
    <option value="en">English</option>
    <option value="ur">Urdu</option>
    <option value="ar">Arabic</option>
    <option value="fr">French</option>
</select>
    <br><br>
    <button id="translate">Translate</button>

    <h2>Translation:</h2>

    <p id="result">Your translation will appear here.</p>

</div>
    

<script src="script.js"></script>


</body>

</html>
